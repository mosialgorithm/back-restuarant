{% extends 'base.html' %}
{% block title %}صفحه ورود {% endblock %}
{% block base_content %}
<!-- <script src="{{url_for('static', filename='scripts/store.js')}}"></script> -->
<section id="authentication" class="container">
    <div class="row">
        <div class="col-12 col-md-4 offset-md-4">
            <div class="auth">
                <div class="auth-header">
                    <img src="{{url_for('static', filename='images/png/logo.png')}}" alt="logo">
                    <p>
                        <span class="fa fa-sign-in me-1"></span>
                        <span>ورود</span>
                    </p>
                </div>
                <div class="auth-body">
                    <form x-data="login">
                        <div class="input-group mb-3">
                            <span class="input-group-text">
                                <i class="fa fa-phone-square"></i>
                            </span>
                            <input x-model="user.mobile" @blur="validateMobile" type="text" class="form-control"
                                placeholder="شماره همراه" :class="{'is-invalid': userError.mobile}">
                            <div x-show="userError.mobile" x-text="userError.mobile_message" class="invalid-feedback">
                            </div>
                        </div>
                        <div class="input-group mb-3">
                            <span class="input-group-text">
                                <i class="fa fa-key"></i>
                            </span>
                            <input x-model="user.password" @blur="validatePassword" type="text" class="form-control"
                                placeholder="گذرواژه" :class="{'is-invalid': userError.password}">
                            <div x-show="userError.password" x-text="userError.password_message"
                                class="invalid-feedback"></div>
                        </div>
                        <div class="text-center">
                            <button @click.prevent="loginForm" class="btn btn-block btn-outline-success w-50">
                                ورود</button>
                        </div>
                    </form>
                    <div class="mt-5">
                        <div class="text-center my-3">
                            <a href="{{url_for('auth.login_by_sms_view')}}" class="text text-info w-50"> ورود با رمز یکبار مصرف</a>
                        </div>
                        <div class="text-center my-3">
                            <a href="{{url_for('auth.register_view')}}" class="text text-danger w-50"> ثبت نام در سایت</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
<script src="{{url_for('static', filename='scripts/store.js')}}"></script>
<script src="{{url_for('static', filename='scripts/app.js')}}"></script>
{% endblock %}
